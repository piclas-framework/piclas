ProjectName  = 70degCone_3D          ! name of the project (used for filenames)
DebugVisu    = F                          ! Write debug mesh to VTK file
DebugMesh    = T
CheckSurfaceNormals = F ! This is required because the test yields a false-positive result for a surface between two elements 11302 and 11303
