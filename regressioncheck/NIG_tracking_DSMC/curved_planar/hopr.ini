!=============================================================================== !
! OUTPUT
!=============================================================================== !
projectname    = planar_curved          ! name of the project (used for filenames)
Debugvisu      = F                      ! Write debug mesh to tecplot file

!=============================================================================== !
! MESH
!=============================================================================== !
Mode             = 3                    ! 1 Cartesian 3 CGNS 4 STAR-CD V3
nZones           = 208                  ! number of zones
Filename         = ./curved_planar.cgns
meshscale        = 1.0E-3                ! scales all input meshes by a factor

!=============================================================================== !
! CURVED
!=============================================================================== !
MeshIsAlreadyCurved= T
BoundaryOrder      = 5
checkElemJacobians = T                  ! checks the Jacobian and scaled Jacobian for each element

!===============================================================================
! BOUNDARY CONDITIONS
!===============================================================================
! Displacement
vv = (/0.,    0.,4.E+3/)

BoundaryName=BC_X-                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 2,0,0,0/)
BoundaryName=BC_X+                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 2,0,0,0/)
BoundaryName=BC_Y-                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 3,0,0,0/)
BoundaryName=BC_Y+                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 3,0,0,0/)
BoundaryName=BC_Z-                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 3,0,0,1/)
BoundaryName=BC_Z+                     ! the BC_Name must be defined in mesh file
BoundaryType=(/ 3,0,0,-1/)
BoundaryName=BC_CURVED                 ! the BC_Name must be defined in mesh file
BoundaryType=(/ 3,0,0,0/)

!===============================================================================
! EXTRUDED 2D MESH OPTIONS
!===============================================================================
MeshExtrude           = T ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope
MeshExtrudeBCIndexTop = ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope
MeshExtrudeBCIndexBot = ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope
MeshExtrudeLength     = 1.E+3 ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope
MeshExtrudeElems      = 2 ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope
MeshExtrudeDir        =  ! Note that the mesh extrusion was created with hopr but has never been tested with pyhope