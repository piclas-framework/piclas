DEFVAR=(INT):    i01 = 1                     ! no. elems in left and right block
DEFVAR=(INT):    i02 = 1                     ! no. elems in upper block (should be twice the value of i01)

DEFVAR=(INT):    ir1 = 1                     ! no. elems in r for first ring
DEFVAR=(REAL):   r01 = 0.2                   ! middle square dim
DEFVAR=(REAL):   r02 = 1                     ! middle square dim
DEFVAR=(REAL):   s0  = 0.5                   ! middle square dim


DEFVAR=(INT):    iz = 1                      !
DEFVAR=(REAL):   la =-0.25                   ! length of domain in z
DEFVAR=(REAL):   lz = 0.25                   ! length of domain in z

DEFVAR=(REAL):   f1 = 1.                     ! stretching factor in first ring

!================================================================================================================================= !
! OUTPUT
!================================================================================================================================= !
ProjectName        = semicircle
Debugvisu          = F                       ! Visualize mesh and boundary conditions (tecplot ascii)
checkElemJacobians = T

!================================================================================================================================= !
! MESH
!================================================================================================================================= !
Mode   = 1                           ! Mode for Cartesian boxes
nZones = 4                           ! number of boxes

! ---------------------------------------------------------------
! Upper cylinder half
! ---------------------------------------------------------------
! Left-lower (x-)
Corner       =(/-r01 , 0.  , la   ,,   -r02 , 0.  , la   ,,   -r02 , r02 , la   ,,   -r01 , r01 , la   ,,   -r01 , 0.  , lz   ,,   -r02 , 0.  , lz   ,,   -r02 , r02 , lz   ,,   -r01 , r01 , lz /)
nElems       =(/ir1,i01,iz/)                   ! number of elements in each direction
BCIndex      =(/1  , 1  , 1  , 0  , 1  , 1/)   ! Indices of Boundary Conditions for  six Boundary Faces (z- , y- , x+ , y+ , x- , z+)
!            =(/z- , y- , x+ , y+ , x- , z+/)  ! Indices of Boundary Conditions
elemtype     =108                              ! element type (108: Hexahedral)
factor       =(/f1,1.,1./)                     ! stretching

! Left-upper (y+)
Corner       =(/0.  , r01 , la   ,,   -r01 , r01 , la   ,,   -r02 , r02 , la   ,,   0.  , r02 , la   ,,   0.  , r01 , lz   ,,   -r01 , r01 , lz   ,,   -r02 , r02 , lz   ,,   0.  , r02 , lz /)
nElems       =(/i02,ir1,iz/)                   ! number of elements in each direction
BCIndex      =(/1  , 1  , 0  , 1  , 0  , 1/)   ! Indices of Boundary Conditions for  six Boundary Faces (z- , y- , x+ , y+ , x- , z+)
!            =(/z- , y- , x+ , y+ , x- , z+/)  ! Indices of Boundary Conditions
elemtype     =108                              ! element type (108: Hexahedral)
factor       =(/1.,f1,1./)                     ! stretching

! Right-lower (x+)
Corner       =(/r01 , 0.  , la   ,,   r02 , 0.  , la   ,,   r02 , r02 , la   ,,   r01 , r01 , la   ,,   r01 , 0.  , lz   ,,   r02 , 0.  , lz   ,,   r02 , r02 , lz   ,,   r01 , r01 , lz /)
nElems       =(/ir1,i01,iz/)                   ! number of elements in each direction
BCIndex      =(/1  , 1  , 1  , 0  , 1  , 1/)   ! Indices of Boundary Conditions for  six Boundary Faces (z- , y- , x+ , y+ , x- , z+)

!            =(/z- , y- , x+ , y+ , x- , z+/)  ! Indices of Boundary Conditions
elemtype     =108                              ! element type (108: Hexahedral)
factor       =(/f1,1.,1./)                     ! stretching

! Right-upper (y+)
Corner       =(/0.  , r01 , la   ,,   r01 , r01 , la   ,,   r02 , r02 , la   ,,   0.  , r02 , la   ,,   0.  , r01 , lz   ,,   r01 , r01 , lz   ,,   r02 , r02 , lz   ,,   0.  , r02 , lz /)
nElems       =(/i02,ir1,iz/)                   ! number of elements in each direction
BCIndex      =(/1  , 1  , 0  , 1  , 0  , 1/)   ! Indices of Boundary Conditions for  six Boundary Faces (z- , y- , x+ , y+ , x- , z+)
!            =(/z- , y- , x+ , y+ , x- , z+/)  ! Indices of Boundary Conditions
elemtype     =108                              ! element type (108: Hexahedral)
factor       =(/1.,f1,1./)                     ! stretching

BoundaryOrder = 3  ! = NGeo+1

!================================================================================================================================= !
! BOUNDARY CONDITIONS
!================================================================================================================================= !
BoundaryName=BC_wall
BoundaryType=(/4,0,1,0/)

!================================================================================================================================= !
! MESH POST DEFORM
!================================================================================================================================= !
MeshPostDeform=cylinder                        ! deforms [-1,1]^2 to a cylinder with radius Postdeform_R0
PostDeform_R0=s0                               ! here domain is [-4,4]^2 mapped to a cylinder with radius 0.25*4 = 1
PostDeform_RR=0.0