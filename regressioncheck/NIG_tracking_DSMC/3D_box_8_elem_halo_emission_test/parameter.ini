! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 0
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N        = 1
NAnalyze = 1
NVisu    = 1
VisuParticles = T
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile   = periodic_mesh.h5
useCurveds = F
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName      = periodic
Logging          = F
WriteErrorFiles  = F
printRandomSeeds = F
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend       = 1
Analyze_dt = 1
useDSMC    = T
ManualTimeStep=1.0
! =============================================================================== !
! PARTICLE TRACKING
! =============================================================================== !
BezierClipTolerance = 1e-9
BezierClipMaxIter   = 100
BezierSplitLimit    = 0.6
BezierClipHit       = 1e-7
BezierElevation     = 0

epsilontol          = 1e-12
TrackingMethod      = refmapping,tracing,triatracking
RefMappingEps       = 1e-12
RefMappingGuess     = 1
Part-LorentzType    = 3
Particles-HaloEpsVelo = 2
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-maxParticleNumber=2
Part-nSpecies=1

Part-Species1-ChargeIC=0.
Part-Species1-MassIC=6e-26
Part-Species1-MacroParticleFactor=1E0

Part-Species1-nInits = 1
Part-Species1-Init1-SpaceIC=point
Part-Species1-Init1-BasePointIC=(/0., 0., 0./)
Part-Species1-Init1-ParticleNumber=1
Part-Species1-Init1-velocityDistribution=constant
! =============================================================================== !
! BOUNDARIES
! =============================================================================== !
Part-nBounds              = 6
Part-Boundary1-SourceName = BC_periodicx+
Part-Boundary1-Condition  = periodic
Part-Boundary2-SourceName = BC_periodicx-
Part-Boundary2-Condition  = periodic
Part-Boundary3-SourceName = BC_periodicy+
Part-Boundary3-Condition  = periodic
Part-Boundary4-SourceName = BC_periodicy-
Part-Boundary4-Condition  = periodic
Part-Boundary5-SourceName = BC_periodicz+
Part-Boundary5-Condition  = periodic
Part-Boundary6-SourceName = BC_periodicz-
Part-Boundary6-Condition  = periodic
Part-nPeriodicVectors     = 3
! Part-FIBGMdeltas=(/1.00,1.00,1.00/)
! =============================================================================== !
! Analysis
! =============================================================================== !
CalcNumSpec = T

! =======================================================================
! Data for Argon taken from
! Species: G. A. Bird, Sophisticated DSMC - Benchmark Case 2007
! =======================================================================
! =============================================================================== !
! Species1, Ar
! =============================================================================== !
Part-Species1-SpeciesName = Ar
Part-Species1-InteractionID = 1
Part-Species1-Tref = 1000
Part-Species1-dref = 3.595E-10
Part-Species1-omega=0.234