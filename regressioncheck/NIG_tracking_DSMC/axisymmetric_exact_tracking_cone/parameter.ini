! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1  ! Polynomial degree
NAnalyze      = 1  ! Number of analyze points
NVisu         = 1
IniExactFunc = 1
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = cone_axi_mesh.h5
useCurveds    = F
TrackingMethod = triatracking
VisuParticles = T
VisuAdaptiveInfo = T

! Symmetry
Particles-Symmetry-Order = 2
Particles-Symmetry2DAxisymmetric = T
Particles-Symmetry2DAxisymmetricExact = T

! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName       = cone
TimeStampLength   = 12
IterDisplayStep   = 100

Part-TimeFracForSampling=0.8
Particles-NumberForDSMCOutputs=1
Particles-DSMC-CalcQualityFactors = F
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend            = 2.0E-7
Analyze_dt      = 2.0E-7
ManualTimeStep  = 1.0E-7
CFLscale   = 0.2  ! Scaling of theoretical CFL number

Particles-HaloEpsVelo=2.0E+03

! =============================================================================== !
! Species1, Argon
! =============================================================================== !
Part-Species1-SpeciesName       = Ar
Part-Species1-ChargeIC          = 0
Part-Species1-MassIC            = 6.63E-26
Part-Species1-InteractionID     = 1
Part-Species1-Tref              = 273
Part-Species1-dref              = 4.05E-10
Part-Species1-omega             = 0.27

! =============================================================================== !
! Boundaries
! =============================================================================== !
Part-nSpecies=1
Part-nBounds=6
Part-Boundary1-SourceName=BC_Xminus
Part-Boundary1-Condition=open
Part-Boundary2-SourceName=BC_Xplus
Part-Boundary2-Condition=reflective
Part-Boundary2-MomentumACC=1.
Part-Boundary2-WallTemp=300.0
Part-Boundary2-TransACC=1.
Part-Boundary2-VibACC=1.
Part-Boundary2-RotACC=1.
Part-Boundary3-SourceName=BC_Yplus
Part-Boundary3-Condition=reflective
Part-Boundary3-MomentumACC=1.
Part-Boundary3-WallTemp=300.0
Part-Boundary3-TransACC=1.
Part-Boundary3-VibACC=1.
Part-Boundary3-RotACC=1.
Part-Boundary4-SourceName=BC_Yminus
Part-Boundary4-Condition=symmetric_axis
Part-Boundary5-SourceName=BC_Zplus
Part-Boundary5-Condition=symmetric_dim
Part-Boundary6-SourceName=BC_Zminus
Part-Boundary6-Condition=symmetric_dim

! =============================================================================== !
! Initial conditions
! =============================================================================== !
Part-Species1-MacroParticleFactor=1E7

! Directed beam with constant velocity distribution at different angles to cover edge cases
Part-Species1-nInits=1
Part-Species1-Init1-SpaceIC=cell_local
Part-Species1-Init1-velocityDistribution=constant
Part-Species1-Init1-PartDensity=2.3388758958045575e+21
Part-Species1-Init1-VeloIC=1000.
Part-Species1-Init1-VeloVecIC=(/1.,0.,0./),(/0.,1.,0./),(/1.,1.,0./)
Part-Species1-Init1-MWTemperatureIC=300
! =============================================================================== !
! DSMC
! =============================================================================== !
UseDSMC=true
Particles-DSMC-CollisMode=1

! Seeds
Part-NumberOfRandomSeeds=2
Particles-RandomSeed1=1
Particles-RandomSeed2=2
