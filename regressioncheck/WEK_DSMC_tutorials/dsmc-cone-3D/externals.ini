! --- Externals Tool Reggie
MPI               = 1                                              , 1                    , 1                        ! Nbr or processes
externalbinary    = pyhope                                         , ./bin/piclas2vtk     , ./bin/piclas2vtk         ! Relative binary path in build directory
externaldirectory = pyhope.ini                                     , parameter.ini        , parameter.ini            ! Directory name, where the files are located for the external tool reggie
externalruntime   = pre                                            , post                 , post                     ! Run after piclas is completed (post: after, pre: before)
cmd_suffix        =                                                , dsmc_cone_State_*.h5 , dsmc_cone_DSMCState_*.h5 ! Suffix for the binary execution
cmd_pre_execute   = gmsh\s70degCone_3D_model.geo\s-parse_and_exit  ,                      ,                          ! Run additional script before external in executed

nocrosscombination:MPI,externalbinary,externaldirectory,externalruntime,cmd_suffix,cmd_pre_execute