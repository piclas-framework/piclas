! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 9000
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 5  ! Polynomial degree
NAnalyze      = 1 ! Number of analyze points
NVisu = 5

! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = plasma_wave_mesh.h5
useCurveds    = F

! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName       = plasma_wave
Logging           = F
WriteErrorFiles   = F
FastPeriodic      = F
DoCalcErrorNorms  = T
TrackingMethod    = refmapping
FlushInitialState = T
! =============================================================================== !
! CALCULATION
! =============================================================================== !
! perform an initial load balance step
DoLoadBalance           = T
DoInitialAutoRestart    = T
Load-DeviationThreshold = 1e-5

tend          = 0.75
Analyze_dt    = 0.75
! =============================================================================== !
! HDG
! =============================================================================== !
ManualTimeStep           = 0.05
Part-LorentzType         = 3
epsCG                    = 1e-6
maxIterCG                = 100
HDGDisplayConvergence    = F

! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-maxParticleNumber    = 51
Part-nSpecies             = 1

Part-nBounds              = 3
Part-Boundary1-SourceName = BC_x+
Part-Boundary1-Condition  = periodic
Part-Boundary2-SourceName = BC_x-
Part-Boundary2-Condition  = periodic
Part-Boundary3-SourceName = BC_sym
Part-Boundary3-Condition  = symmetric_dim
Part-nPeriodicVectors     = 1
Particles-Symmetry-Order  = 1

! =============================================================================== !
! PIC: Interpolation/Deposition
! =============================================================================== !
PIC-DoInterpolation         = T
PIC-Interpolation-Type      = particle_position
PIC-Deposition-Type         = shape_function , shape_function_cc , shape_function_adaptive
PIC-shapefunction-dimension = 1
PIC-shapefunction-direction = 1
PIC-shapefunction-radius    = 0.1
PIC-shapefunction-alpha     = 4

Particles-MPIWeight       = 0.02
Part-FIBGMdeltas          = (/1.,1.,1./)
Part-FactorFIBGM          = (/6,1,1/)

! -------------------------------------
! Beam 1
! -------------------------------------
Part-Species1-ChargeIC            = -1
Part-Species1-MassIC              = 2.8608265867e9
Part-Species1-MacroParticleFactor = 0.02

Part-Species1-nInits=1

Part-Species1-Init1-SpaceIC               = cos_distribution!sin_deviation
Part-Species1-Init1-velocityDistribution  = constant
Part-Species1-Init1-ParticleNumber        = 50
Part-Species1-Init1-maxParticleNumber-x   = 50
Part-Species1-Init1-maxParticleNumber-y   = 1
Part-Species1-Init1-maxParticleNumber-z   = 1
Part-Species1-Init1-Amplitude             = 0.01
Part-Species1-Init1-WaveNumber            = 1.
Part-Species1-Init1-VeloIC                = 0.
Part-Species1-Init1-VeloVecIC             = (/1.,0.,0./)

! =============================================================================== !
! Analysis
! =============================================================================== !
CalcCharge               = F
CalcPotentialEnergy      = T
velocityOutputAtTime     = T
CalcKineticEnergy        = T
PIC-OutputSource         = T
PIC-VerifyCharge         = F
TimeStampLength          = 8
