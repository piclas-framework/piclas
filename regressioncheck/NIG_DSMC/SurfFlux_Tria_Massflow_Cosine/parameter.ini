! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1  ! Polynomial degree
NAnalyze      = 1  ! Number of analyze points
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = channel_mesh.h5
useCurveds    = F
TrackingMethod = triatracking
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName      = SurfFlux_Tria_EmissionCurrent
IterDisplayStep  = 10
Part-AnalyzeStep = 1
CalcSurfFluxInfo = T
VisuParticles = T
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend            = 1.0000E-11
Analyze_dt      = 1.0000E-11
ManualTimeStep  = 1.0000E-11
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-nSpecies=1
Part-nBounds=6
Part-Boundary1-SourceName=BC_Xplus
Part-Boundary1-Condition=open
Part-Boundary2-SourceName=BC_Xminus
Part-Boundary2-Condition=reflective
Part-Boundary3-SourceName=BC_Yplus
Part-Boundary3-Condition=reflective
Part-Boundary4-SourceName=BC_Yminus
Part-Boundary4-Condition=reflective
Part-Boundary5-SourceName=BC_Zplus
Part-Boundary5-Condition=symmetric
Part-Boundary6-SourceName=BC_Zminus
Part-Boundary6-Condition=symmetric
! =============================================================================== !
! Species1 - electron
! =============================================================================== !
Part-Species1-SpeciesName = electron
Part-Species1-MacroParticleFactor = 2E2

Part-Species1-nSurfaceFluxBCs=1
Part-Species1-Surfaceflux1-BC=2

Part-Species1-Surfaceflux1-Massflow = 1.1372E-11
Part-Species1-Surfaceflux1-velocityDistribution = cosine, cosine, cosine, cosine_double
Part-Species1-Surfaceflux1-CosineExponent = 0.5,1.0,2.0,0.5
Part-Species1-Surfaceflux1-CosineA = 2.0
Part-Species1-Surfaceflux1-CosineB = 1.0
Part-Species1-Surfaceflux1-CosineExponent2 = 3.
Part-Species1-Surfaceflux1-VeloIC = 300.
Part-Species1-Surfaceflux1-MWTemperatureIC = 300.
Part-Species1-Surfaceflux1-VeloVecIC = (/1,0,0/)


nocrosscombination:Part-Species1-Surfaceflux1-velocityDistribution,Part-Species1-Surfaceflux1-CosineExponent
! =============================================================================== !
! DSMC
! =============================================================================== !
Particles-Species-Database = SpeciesDatabase.h5
Particles-HaloEpsVelo=2.0E+06
Particles-DSMC-CalcSurfaceVal=F
UseDSMC=true
Particles-DSMC-CollisMode=0
Part-NumberOfRandomSeeds=2
Particles-RandomSeed1=5
Particles-RandomSeed2=6
Particles-DSMC-UseOctree=F
Particles-DSMC-UseNearestNeighbour = F
Particles-DSMC-CalcQualityFactors=F