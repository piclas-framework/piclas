! =============================================================================== !
! POSTI
! =============================================================================== !
VisuParticles   = T
NVisu           = 1
TimeStampLength = 21
! =============================================================================== !
! VARIABLES
! =============================================================================== !
CFLscale      = 0.2
IniExactFunc  = 0
N             = 1
NAnalyze      = 1
! =============================================================================== !
! MESH
! =============================================================================== !
ProjectName   = Ar_Plasma_Chemistry_Test
MeshFile      = cube_mesh.h5
Logging       = F
useCurveds    = F
TrackingMethod = triatracking
! =============================================================================== !
! PART ANALYZE
! =============================================================================== !
Part-AnalyzeStep = 100
CalcCollRates    = F
CalcReacRates    = T
CalcRelaxProb    = T
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend                      = 2.0E-10
Analyze_dt                = 2.0E-10  ! Timestep of analyze outputs
ManualTimeStep            = 2.0E-12
IterDisplayStep           = 10
! =============================================================================== !
! DSMC
! =============================================================================== !
UseDSMC                           = T
Particles-DSMC-CollisMode         = 3
Part-NumberOfRandomSeeds          = 2
Particles-RandomSeed1             = 3
Particles-RandomSeed2             = 4
Particles-HaloEpsVelo             = 3E5
Particles-DSMC-CalcQualityFactors = F

Particles-CollXSec-Database       = LXCat_Database_Hayashi_Ar_electron_Phelps_Ar_ArIon.h5
Particles-CollXSec-NullCollision  = T
Part-Species1-UseCollXSec         = T
Part-Species2-UseElecXSec         = T
Part-Species3-UseCollXSec         = T

Particles-DSMCElectronicDatabase  = Electronic-State-Database-Ar-ArIon1.h5

Particles-DSMCReservoirSim        = T
Particles-DSMCReservoirSimRate    = T
Particles-DSMCReservoirStatistic  = T

Particles-DSMC-ElectronicModel    = 3

Particles-Symmetry-Order           = 2
Particles-Symmetry2DAxisymmetric   = T
Part-Weight-Type = radial
Part-Weight-Radial-ScaleFactor = 25
Part-Weight-CloneMode = 0
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-nBounds=6
Part-Boundary1-SourceName=BC_Xplus
Part-Boundary1-Condition=reflective
Part-Boundary2-SourceName=BC_Xminus
Part-Boundary2-Condition=reflective
Part-Boundary3-SourceName=BC_Yplus
Part-Boundary3-Condition=reflective
Part-Boundary4-SourceName=BC_Yminus
Part-Boundary4-Condition=symmetric_axis
Part-Boundary5-SourceName=BC_Zplus
Part-Boundary5-Condition=symmetric_dim
Part-Boundary6-SourceName=BC_Zminus
Part-Boundary6-Condition=symmetric_dim
! =============================================================================== !
! SPECIES
! =============================================================================== !
Part-nSpecies=3
! =============================================================================== !
! Weighting Factor
! =============================================================================== !
Part-Species$-MacroParticleFactor   = 100.0
! =============================================================================== !
! Species1 | e
! =============================================================================== !
Part-Species1-MassIC                      = 9.11E-31
Part-Species1-ChargeIC                    = -1.60217653E-19

Part-Species1-nInits = 1
Part-Species1-Init1-velocityDistribution  = constant
Part-Species1-Init1-SpaceIC               = cell_local
Part-Species1-Init1-VeloIC                = 2481019, 2652321, 2813211, 2965384
Part-Species1-Init1-PartDensity           = 1E21
Part-Species1-Init1-VeloVecIC             = (/1.,1.,0./)
Part-Species1-Init1-MWTemperatureIC       = 300.
! =============================================================================== !
! Species2 - Argon
! =============================================================================== !
Part-Species2-MassIC                = 6.63400E-26
Part-Species2-ChargeIC              = 0

Part-Species2-nInits                      = 1
Part-Species2-Init1-SpaceIC               = background
Part-Species2-Init1-velocityDistribution  = maxwell_lpn
Part-Species2-Init1-MWTemperatureIC       = 300
Part-Species2-Init1-PartDensity           = 1.0E+23
Part-Species2-Init1-VeloIC                = 0
Part-Species2-Init1-VeloVecIC             = (/0.,0.,1./)
Part-Species2-Init1-TempElec              = 300
! =============================================================================== !
! Species3 - ArgonIon
! =============================================================================== !
Part-Species3-MassIC                = 6.633908906174E-26
Part-Species3-ChargeIC              = 1.60217653E-19

Part-Species3-nInits                     = 1
Part-Species3-Init1-SpaceIC              = cell_local
Part-Species3-Init1-velocityDistribution = maxwell_lpn
Part-Species3-Init1-MWTemperatureIC      = 0.1
Part-Species3-Init1-PartDensity          = 1E21
Part-Species3-Init1-VeloIC               = 13002, 13900, 14743, 15541
Part-Species3-Init1-VeloVecIC            = (/1.,1.,0./)
Part-Species3-Init1-Tempelec             = 0.1

nocrosscombination:Part-Species1-Init1-VeloIC,Part-Species3-Init1-VeloIC
! =============================================================================== !
! Species1, Electron
! =============================================================================== !
Part-Species1-SpeciesName       = electron
Part-Species1-InteractionID     = 4
Part-Species1-Tref              = 273
Part-Species1-dref              = 2E-15
Part-Species1-omega             = 0.24
! =============================================================================== !
! Species2, Argon
! =============================================================================== !
Part-Species2-SpeciesName       = Ar
Part-Species2-InteractionID     = 1
Part-Species2-Tref              = 273
Part-Species2-dref              = 4.05E-10
Part-Species2-omega             = 0.24
Part-Species2-HeatOfFormation_K = 0.0
! =============================================================================== !
! Species3, Argon ion
! =============================================================================== !
Part-Species3-SpeciesName       = ArIon1
Part-Species3-InteractionID     = 10
Part-Species3-Tref              = 273
Part-Species3-dref              = 4.05E-10
Part-Species3-omega             = 0.24
Part-Species3-PreviousState     = 2
! =============================================================================== !
! Reactions
! =============================================================================== !
DSMC-NumOfReactions=1
! ----------------------------------------------------
! Electron impact
! ----------------------------------------------------
! Dissociation: Ar + e --> ArIon1 + e + e
DSMC-Reaction1-ReactionModel        = XSec
DSMC-Reaction1-Reactants            = (/2,1,0/)
DSMC-Reaction1-Products             = (/3,1,1,0/)