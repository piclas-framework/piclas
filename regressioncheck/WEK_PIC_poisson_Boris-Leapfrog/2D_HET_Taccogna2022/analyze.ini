! Integrate the number of electrons impinging on the anode
integrate_line_file            = SurfaceAnalyze.csv ! Data file name
integrate_line_columns         = 0:14               ! Columns x:y for integration y over x, .i.e., 002-Flux-Spec-002-BC_ANODE over 001-TIME
integrate_line_integral_value  = 1.86E-11           ! Integrated electric current that is emitted due to the neutralization injection current
integrate_line_tolerance_value = 80e-2              ! Tolerance
integrate_line_tolerance_type  = relative           ! Relative or absolute tolerance