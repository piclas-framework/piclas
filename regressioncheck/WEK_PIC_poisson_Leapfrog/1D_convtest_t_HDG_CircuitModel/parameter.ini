! =============================================================================== !
! Analytical solution
! =============================================================================== !
IniExactFunc = 10001
DoCalcErrorNorms = T
OutputErrorNormsToH5 = T
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1
Nvisu         = 1
VisuParticles = T
! =============================================================================== !
! DLOAD BALANCING
! =============================================================================== !
DoLoadBalance           = T
DoInitialAutoRestart    = F
Load-DeviationThreshold = 5e-2
LoadBalanceMaxSteps     = 10
UseH5IOLoadBalance      = T
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile = 1D_mortonZ_mesh.h5
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName         = 1D_CMBC
! doPrintStatusLine   = T
Part-AnalyzeStep    = 1
Surface-AnalyzeStep = 1
Field-AnalyzeStep   = 1
Part-IterationForMacroVal=5000

CalcSurfFluxInfo                  = T
CalcNumSpec                       = T
CalcNumDens                       = T
CalcElectronSEE                   = T

CalcHaloInfo            = T
CalcMeshInfo            = T
CalcPotentialEnergy     = T
CalcPartBalance         = T
PIC-OutputSource        = T
CalcTemp                = T
CalcPlasmaParameter     = T
CalcNumPlasmaParameter  = T
CalcDebyeLength         = T
CalcIonizationDegree    = T
CalcPlasmaFrequency     = T
CalcElectronIonDensity  = T
CalcElectronTemperature = T
CalcSurfaceImpact       = T

!Cyclotron Analyze Parameters
CalcPICTimeStepCyclotron = T
CalcCyclotronFrequency   = T

! PIC accuracy/stability parameters
CalcPICCFLCondition      = T
CalcMaxPartDisplacement  = T
CalcPICTimeStep          = T
CalcPointsPerDebyeLength = T

! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep  = 1e-9
tend            =  73e-9
Analyze_dt      = 73e-9 ! 1e-8
IterDisplayStep = 1000
PrecondType     = 10
PETScDisplayDiagnostics = F
TrackingMethod = triatracking
TimeStampLength = 15
! =============================================================================== !
! PARTICLE Boundary Conditions
! =============================================================================== !
CalcBoundaryParticleOutput = T
BPO-NPartBoundaries = 2
BPO-PartBoundaries  = (/1,2/)
BPO-NSpecies        = 1
BPO-Species         = (/1/)
! =============================================================================== !
! PIC
! =============================================================================== !
! PIC-Interpolation-Type    = particle_position
PIC-DoDeposition = F ! Deactivate deposition
! PIC-Deposition-Type       = cell_volweight_mean
PIC-DoInterpolation = F ! Deactivate interpolation
! =============================================================================== !
! Field Boundaries
! =============================================================================== !
BoundaryName = bc_right
! BoundaryType = (/20,1/) ! 20: activate FPC, 2: Group #1


BoundaryType = (/40,1/) ! 5: Dirichlet, 1: Nbr of RefState
! BoundaryType = (/5,1/) ! 5: Dirichlet, 1: Nbr of RefState
RefState     = (/1.0, 13.56e6, 0.0/) ! BCType=40 for CMBC and the BCState=1 defines the number of the RefState
! CMBC-Capacitance = 1e9
! CMBC-Capacitance = 1.1
! CMBC-Capacitance = 5e-9 ! 5nF capacitor
CMBC-Capacitance = 1e-11
! CMBC-Capacitance = 0.0

BoundaryName = bc_left
BoundaryType = (/4,0/)

! =============================================================================== !
! SYMMETRY
! =============================================================================== !
! Particles-Symmetry-Order = 1 ! this only works with "symmetric_dim" particle BCs
! =============================================================================== !
! PARTICLE Boundary Condition
! =============================================================================== !
Part-nBounds = 6
Part-nPeriodicVectors = 2

Part-Boundary1-SourceName = bc_left
Part-Boundary1-Condition  = open

Part-Boundary2-SourceName = bc_right
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = BC_periodicy+
Part-Boundary3-Condition  = periodic ! symmetric_dim

Part-Boundary4-SourceName = BC_periodicy-
Part-Boundary4-Condition  = periodic ! symmetric_dim

Part-Boundary5-SourceName = BC_periodicz+
Part-Boundary5-Condition  = periodic ! symmetric_dim

Part-Boundary6-SourceName = BC_periodicz-
Part-Boundary6-Condition  = periodic ! symmetric_dim
! =============================================================================== !
! SPECIES
! =============================================================================== !
Part-nSpecies = 1
! =============================================================================== !
! Species2 | e
! =============================================================================== !
Part-Species1-MassIC   = 9.11E-31
Part-Species1-ChargeIC = -1.60217653E-19
Part-Species1-MacroParticleFactor = 2.0e3

! Part-Species1-nInits = 0
!
! Part-Species1-Init1-SpaceIC              = point ! cuboid
! Part-Species1-Init1-velocityDistribution = maxwell_lpn
! Part-Species1-Init1-MWTemperatureIC      = 1.0
! Part-Species1-Init1-ParticleNumber       = 10000
! Part-Species1-Init1-BasePointIC          = (/0.9999 , 0.  , 0.  /)
! Part-Species1-Init1-BaseVector1IC        = (/0. , 0.  , 0.     /)
! Part-Species1-Init1-BaseVector2IC        = (/0. , 0.  , 0.     /)
! Part-Species1-Init1-NormalIC             = (/1. , 0.  , 0.     /)
! Part-Species1-Init1-CuboidHeightIC       = 10e-4
! Part-Species1-Init1-VeloIC               = 3e4
! Part-Species1-Init1-VeloVecIC            = (/1.,0.,0./)

Part-Species1-nSurfaceFluxBCs=1

Part-Species1-Surfaceflux1-BC                   = 1
Part-Species1-Surfaceflux1-velocityDistribution = maxwell_lpn
Part-Species1-Surfaceflux1-VeloIC               = 10e7
Part-Species1-Surfaceflux1-VeloVecIC            = (/1.0, 0.0, 0.0/)
Part-Species1-Surfaceflux1-MWTemperatureIC      = 300.
Part-Species1-Surfaceflux1-Adaptive             = T
Part-Species1-Surfaceflux1-Adaptive-Type        = 4
Part-Species1-Surfaceflux1-Adaptive-Massflow    = 1.00E-15