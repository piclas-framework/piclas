! --- Externals Tool Reggie
MPI               = 1          , 1                 , 1                                      ! Single execution
externalbinary    = pyhope     , ./bin/piclas      , ./bin/piclas2vtk                       ! Relative binary path in build directory
externaldirectory = pyhope.ini , parameter-pre.ini , parameter.ini                          ! Directory name, where the files are located for the external tool reggie
externalruntime   = pre        , pre               , post                                   ! Run after piclas is completed (post: after, pre: before)
cmd_suffix        =            ,                   , 2D_CMBC_State_000.00000014749000000.h5 ! Command suffix
nocrosscombination:MPI,externalbinary,externaldirectory,externalruntime,cmd_suffix