! =============================================================================== !
! POSTI
! =============================================================================== !
IniExactFunc = 0
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1
Nvisu         = 1
VisuParticles = T
! =============================================================================== !
! DLOAD BALANCING
! =============================================================================== !
DoLoadBalance           = T
DoInitialAutoRestart    = F
Load-DeviationThreshold = 5e-2
LoadBalanceMaxSteps     = 10
UseH5IOLoadBalance      = T
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile = 2D_corner_mesh.h5
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName         = 2D_restart
! doPrintStatusLine   = T
Part-AnalyzeStep    = 1
Surface-AnalyzeStep = 1
Field-AnalyzeStep   = 1
Part-IterationForMacroVal=5000

Particles-DSMC-CalcQualityFactors = T         ! pmax ... percent resolved
CalcSurfFluxInfo                  = T
CalcNumSpec                       = T
CalcNumDens                       = T
CalcElectronSEE                   = T

CalcHaloInfo            = T
CalcMeshInfo            = T
CalcPotentialEnergy     = T
CalcPartBalance         = T
PIC-OutputSource        = T
CalcTemp                = T
CalcPlasmaParameter     = T
CalcNumPlasmaParameter  = T
CalcDebyeLength         = T
CalcIonizationDegree    = T
CalcPlasmaFrequency     = T
CalcElectronIonDensity  = T
CalcElectronTemperature = T
CalcSurfaceImpact       = T

!Cyclotron Analyze Parameters
CalcPICTimeStepCyclotron = T
CalcCyclotronFrequency   = T

! PIC accuracy/stability parameters
CalcPICCFLCondition      = T
CalcMaxPartDisplacement  = T
CalcPICTimeStep          = T
CalcPointsPerDebyeLength = T

! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep  = 5e-11
tend            = 2e-8
Analyze_dt      = 1.4749E-07
IterDisplayStep = 100
PrecondType     = 10
PETScDisplayDiagnostics = F
TrackingMethod = triatracking
! =============================================================================== !
! PARTICLE Boundary Conditions
! =============================================================================== !
CalcBoundaryParticleOutput = T
BPO-NPartBoundaries = 3
BPO-PartBoundaries  = (/1,2,5/)
BPO-NSpecies        = 1
BPO-Species         = (/1/)
! =============================================================================== !
! PIC
! =============================================================================== !
PIC-Interpolation-Type    = particle_position
PIC-Deposition-Type       = cell_volweight_mean
PIC-DoInterpolation = F ! Deactivate interpolation
! =============================================================================== !
! Field Boundaries
! =============================================================================== !
BoundaryName = bc_anode
BoundaryType = (/40,1/) ! 5: Dirichlet, 1: Nbr of RefState
RefState     = (/100.0, 13.56e6, 0.0/) ! BCType=40 for CMBC and the BCState=1 defines the number of the RefState
! CMBC-Capacitance = 5e-9 ! 5nF capacitor
CMBC-Capacitance = 5e-11 ! 5nF capacitor

BoundaryName = bc_outlet
BoundaryType = (/10,0/)

BoundaryName = bc_wall
BoundaryType = (/4,0/)

BoundaryName = bc_rotsym
BoundaryType = (/10,0/)

BoundaryName = bc_dielectric
BoundaryType = (/100,0/)

BoundaryName = bc_symaxis
BoundaryType = (/10,0/)
! =============================================================================== !
! SYMMETRY
! =============================================================================== !
Particles-Symmetry-Order         = 2
Particles-Symmetry2DAxisymmetric = T
! =============================================================================== !
! Dielectric Region
! =============================================================================== !
DoDielectric         = T
DielectricNbrOfZones = 1
DielectricZoneID     = (/3/)
DielectricZoneEpsR   = (/12.0/)
DielectricZoneMuR    = (/1.0/)
! =============================================================================== !
! PARTICLE Boundary Condition
! =============================================================================== !
Part-nBounds = 6

Part-Boundary1-SourceName = bc_anode
Part-Boundary1-Condition  = open

Part-Boundary2-SourceName = bc_outlet
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = bc_wall
Part-Boundary3-Condition  = reflective

Part-Boundary4-SourceName = bc_rotsym
Part-Boundary4-Condition  = symmetric_dim

Part-Boundary5-SourceName = bc_dielectric
Part-Boundary5-Condition  = reflective
Part-Boundary5-Dielectric = T
Part-Boundary5-NbrOfSpeciesSwaps = 1
Part-Boundary5-SpeciesSwaps1     = (/1,0/)

Part-Boundary6-SourceName = bc_symaxis
Part-Boundary6-Condition  = symmetric_axis
! =============================================================================== !
! SPECIES
! =============================================================================== !
Part-nSpecies = 1
! =============================================================================== !
! Weighting Factor
! =============================================================================== !
Part-Species$-MacroParticleFactor = 1e7
Part-vMPF                         = F
Part-Species$-vMPFMergeThreshold  = 1500 !, 10
Part-Species$-vMPFSplitThreshold  = 50  !, 5
! Use reduced values for split & merge for the gmsh mesh to reduce the computational effort
! nocrosscombination:MeshFile,Part-Species$-vMPFSplitThreshold,Part-Species$-vMPFMergeThreshold
! Part-vMPFSplitLimit                 = 100
! =============================================================================== !
! Species2 | e
! =============================================================================== !
Part-Species1-MassIC   = 9.11E-31
Part-Species1-ChargeIC = -1.60217653E-19

Part-Species1-nInits = 1

Part-Species1-Init1-SpaceIC              = cuboid
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-MWTemperatureIC      = 1.0
Part-Species1-Init1-ParticleNumber       = 20000
Part-Species1-Init1-BasePointIC          = (/0.199999e-3  , 0.      , -1e-7 /)
Part-Species1-Init1-BaseVector1IC        = (/0.           , 16.5e-3 , 0.    /)
Part-Species1-Init1-BaseVector2IC        = (/0. , 0. , 2e-7/)
Part-Species1-Init1-NormalIC             = (/1. , 0. , 0./)
Part-Species1-Init1-CuboidHeightIC       = 10e-4
Part-Species1-Init1-VeloIC               = 3e4
Part-Species1-Init1-VeloVecIC            = (/1.,0.,0./)