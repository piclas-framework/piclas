! compare the last row in FieldAnalyze.csv with a reference file
compare_data_file_name            = FieldAnalyze.csv
compare_data_file_reference       = FieldAnalyze_ref.csv
compare_data_file_tolerance       = 10E-2
compare_data_file_tolerance_type  = relative
compare_data_file_max_differences = 2 ! because of "004-HDG-RunTime", "005-HDG-RunTimePerIteration"


! Integrate "009-CMBC-Capacitor-Voltage" over time
integrate_line_file            = FieldAnalyze.csv ! Data file name
integrate_line_columns         = 0:8              ! Columns x:y for integration y over x, .i.e., 002-Flux-Spec-002-BC_ANODE over 001-TIME
integrate_line_integral_value  = -2.84162e-5      ! Integrated electric current that is emitted due to the neutralization injection current
integrate_line_tolerance_value = 1e-2             ! Tolerance (largest difference was observed to be 12.36% on reggie server)
integrate_line_tolerance_type  = relative         ! Relative or absolute tolerance