! Just check that the L2 norm does not explode, which indicates a severe error
analyze_L2 = 1e2

! check that the surface charge density values are in a specific range at tEnd
check_hdf5_file        = 1D_DCBC_State_000.00000000000100000.h5
check_hdf5_data_set    = SurfNodeSource
check_hdf5_span        = 1 ! check all rows
check_hdf5_dimension   = 0:0
check_hdf5_limits      = 6e-12:13e-12

! Compare converted VTK file
vtudiff_file                       = 1D_DCBC_SurfNodeSource_000.00000000000100000.vtu
vtudiff_reference_file             = 1D_DCBC_SurfNodeSource_000.00000000000100000_ref.vtu
vtudiff_absolute_tolerance_value   = 0.0     ! absolute(a - b) <= (atol + rtol * absolute(b))
vtudiff_relative_tolerance_value   = 30.0e-2 ! absolute(a - b) <= (atol + rtol * absolute(b))
vtudiff_array_name                 = SurfaceChargeDensity