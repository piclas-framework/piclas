! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 0 ! empty
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1  ! Polynomial degree
NVisu         = 1
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = turner2013_mesh.h5
useCurveds    = F
! =============================================================================== !
! Load Balance
! =============================================================================== !
DoLoadBalance           = T
DoInitialAutoRestart    = F
UseH5IOLoadBalance      = F
Load-DeviationThreshold = 1e-6
LoadBalanceMaxSteps     = 1
LoadBalanceSample       = 1
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName       = turner2013
Logging           = F
WriteErrorFiles   = F
printRandomSeeds  = F
! Boundary Field Output
Field-AnalyzeStep       = 10
CalcBoundaryFieldOutput = T
BFO-NFieldBoundaries    = 1     ! Nbr of boundaries
BFO-FieldBoundaries     = (/5/) ! Field-Boundary5 (BC_left from hopr.ini)
! =============================================================================== !
! PIC Temporal Averaging
! =============================================================================== !
CalcTimeAverage = T
VarNameAvg      = ChargeDensity-Spec01
! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep           = 9.220000E-11
tend                     = 7.37600E-08
Analyze_dt               = 7.37600E-09
IterDisplayStep          = 10

TrackingMethod = triatracking
! =============================================================================== !
! FIELD SOLVER
! =============================================================================== !
Part-FIBGMdeltas  = (/6.7e-2,3.42e-5,3.42e-5/)
Part-FactorFIBGM  = (/ 10.0, 1.0, 1.0 /)

BoundaryName = BC_left
BoundaryType = (/53,1/) ! Dirichlet with sine function defined by the corresponding RefState
RefState     = (/200 , 13.56E6 , -100/) ! Voltage, Frequency and Constant Bias Voltage

BoundaryName = BC_right
BoundaryType = (/4,0/) ! Dirichlet with zero potential

! HDG
epsCG     = 1e-6
maxIterCG = 2000

PIC-DoDeposition    = T
PIC-Deposition-Type = cell_volweight_mean
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-nBounds              = 6

Part-Boundary1-SourceName = BC_left
Part-Boundary1-Condition  = open

Part-Boundary2-SourceName = BC_right
Part-Boundary2-Condition  = reflective

Part-Boundary3-SourceName = BC_periodicy-
Part-Boundary3-Condition  = periodic
Part-Boundary4-SourceName = BC_periodicy+
Part-Boundary4-Condition  = periodic
Part-Boundary5-SourceName = BC_periodicz-
Part-Boundary5-Condition  = periodic
Part-Boundary6-SourceName = BC_periodicz+
Part-Boundary6-Condition  = periodic
Part-nPeriodicVectors = 2

Part-nSpecies          = 1
! =============================================================================== !
! Species1 - electron
! =============================================================================== !
Part-Species1-SpeciesName=electron
Part-Species1-MassIC              = 9.11E-31
Part-Species1-ChargeIC            = -1.60217653E-19
Part-Species1-MacroParticleFactor = 5E4