!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName = box_split2hex  ! name of the project (used for filenames)
Debugvisu   = F              ! Write debug mesh to file

!=============================================================================== !
! MESH
!=============================================================================== !
Mode          =1                           ! 1 Cartesian 2 gambit file 3 CGNS
nZones        =1                           ! number of zones
