BoundaryType   = (/4,0,0,0/)
BoundaryName   = BC_yplus
BoundaryType   = (/4,0,0,0/)
BoundaryName   = BC_yminus
BoundaryType   = (/4,0,0,0/)
BoundaryName   = BC_zplus
BoundaryType   = (/4,0,0,0/)
BoundaryName   = BC_zminus
BoundaryType   = (/4,0,0,0/)
BoundaryName   = BC_inner
BoundaryType   = (/100,0,0,0/)