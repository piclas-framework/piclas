! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
IniExactFunc  = 0
N             = 1  ! Polynomial degree
NAnalyze      = 1  ! Number of analyze points
CFLscale      = 0.2  ! Scaling of theoretical CFL number
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile        = cube_mesh.h5
useCurveds      = F
TrackingMethod  = triatracking
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName          = coverage
TimeStampLength      = 14
IterDisplayStep      = 8000
Part-AnalyzeStep     = 1600
Surface-AnalyzeStep  = 1600
Surf-CalcCollCounter = T   ! nSurfColl-Spec: impingement rate on the catalytic wall (Hertz-Knudsen)
CalcTemp             = TRUE
CalcNumDens          = TRUE
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend            = 10E-9
Analyze_dt      = 2E-9
ManualTimeStep  = 1.25E-12
! Load balance: test both schemes (via HDF5 I/O and via direct MPI communication) so that
! the restart of ChemWallProp (the CatalyticData array) is covered by both paths.
DoLoadBalance           = T
UseH5IOLoadBalance      = T,F
PartWeightLoadBalance   = T
LoadBalanceMaxSteps     = 2
Load-DeviationThreshold = 0.00001   ! force the load balance steps to actually be performed
! =============================================================================== !
! BOUNDARY CONDITIONS
! =============================================================================== !
! BC_Xminus: inflow plane, emits a Maxwellian flux and absorbs everything that returns
! BC_Xplus : catalytic wall
! BC_Y/Z   : symmetric (specular), the set-up is one-dimensional in x
Part-maxParticleNumber = 1000000
Part-nBounds=6
Part-Boundary1-SourceName = BC_Xplus
Part-Boundary1-Condition = reflective
Part-Boundary1-WallTemp = 1116.8
Part-Boundary1-LatticeVector = 0.389E-9
Part-Boundary1-Species1-Coverage    = 0.09    ! starts above the equilibrium and desorbs
Part-Boundary1-Species1-MaxCoverage = 0.333
Part-Boundary2-SourceName = BC_Xminus
Part-Boundary2-Condition = open
Part-Boundary3-SourceName = BC_Yplus
Part-Boundary3-Condition = symmetric
Part-Boundary4-SourceName = BC_Yminus
Part-Boundary4-Condition = symmetric
Part-Boundary5-SourceName = BC_Zplus
Part-Boundary5-Condition = symmetric
Part-Boundary6-SourceName = BC_Zminus
Part-Boundary6-Condition = symmetric
Part-FIBGMdeltas = (/10e-9,10e-9,10e-9/)

Part-nSpecies = 1
Part-Species$-MacroParticleFactor = 1.0
! =============================================================================== !
! Species1 - CO
! =============================================================================== !
Part-Species1-MassIC = 4.65100E-26     ! CO Molecular Mass
Part-Species1-ChargeIC = 0

Part-Species1-nInits = 1
Part-Species1-Init1-SpaceIC              = cell_local
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-MWTemperatureIC      = 1116.8
Part-Species1-Init1-PartDensity          = 7.03323E+23
Part-Species1-Init1-VeloIC               = 0.
Part-Species1-Init1-VeloVecIC            = (/1.,0.,0./)

Part-Species1-nSurfaceFluxBCs                   = 1
Part-Species1-Surfaceflux1-BC                   = 2
Part-Species1-Surfaceflux1-velocityDistribution = maxwell_lpn
Part-Species1-Surfaceflux1-MWTemperatureIC      = 1116.8
Part-Species1-Surfaceflux1-PartDensity          = 7.03323E+23
! =============================================================================== !
! Surface Chemistry (literature values for CO on palladium)
! =============================================================================== !
Surface-NumOfReactions = 2
! Adsorption of CO (Kisliuk, non-dissociative)
Surface-Reaction1-SurfName = Adsorption_CO
Surface-Reaction1-Type = A
Surface-Reaction1-Reactants = (/1,0/)
Surface-Reaction1-NumOfBoundaries = 1
Surface-Reaction1-Boundaries = 1
Surface-Reaction1-StickingCoefficient = 1.0
Surface-Reaction1-EqConstant = 0.6
Surface-Reaction1-ReactHeat = 16244.8
Surface-Reaction1-HeatScaling = 7340.2
! Desorption of CO (Polanyi-Wigner, first order, coverage-dependent nu and E_act)
Surface-Reaction2-SurfName = Desorption_CO
Surface-Reaction2-Type = D
Surface-Reaction2-Reactants = (/1,0/)
Surface-Reaction2-Products = (/1,0,0/)
Surface-Reaction2-NumOfBoundaries = 1
Surface-Reaction2-Boundaries = 1
Surface-Reaction2-Energy = 17688.8
Surface-Reaction2-LateralInteraction = -18410.8
Surface-Reaction2-Ca = 16
Surface-Reaction2-Cb = -15
Surface-Reaction2-ReactHeat = 16244.8
Surface-Reaction2-HeatScaling = 7340.2
! =============================================================================== !
! DSMC
! =============================================================================== !
UseDSMC = true
Particles-DSMC-CollisMode = 0   ! free molecular: the impingement flux is exactly the Hertz-Knudsen flux
Part-NumberOfRandomSeeds  = 2
Particles-RandomSeed1 = 332432
Particles-RandomSeed2 = 4934299
Part-TimeFracForSampling = 0.2
Particles-DSMC-CalcSurfaceVal = true
Particles-NumberForDSMCOutputs = 1
Particles-DSMC-CalcQualityFactors = F

Particles-HaloEpsVelo = 3E4
NVisu=1
