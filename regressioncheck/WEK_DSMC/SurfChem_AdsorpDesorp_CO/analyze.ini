! Coverage of the catalytic wall at the end of the simulation (16 sub-surfaces).
! Per-side scatter is about 6%; independent random seeds differ by up to 16% on a single
! sub-surface, while a 10% error in the desorption prefactor already gives 36%, so 30%
! separates the two.
h5diff_file            = coverage_DSMCSurfState_000.0000000100.h5
h5diff_reference_file  = coverage_DSMCSurfState_000.0000000100_ref.h5
h5diff_data_set        = SurfaceData
h5diff_tolerance_value = 30E-2
h5diff_tolerance_type  = relative
h5diff_var_attribute   = VarNamesSurface
h5diff_var_name        = Spec001_Coverage

! PartAnalyze  : number density and translational temperature
! SurfaceAnalyze: number of impacts on the catalytic wall (Hertz-Knudsen flux)
compare_data_file_name           = PartAnalyze.csv, SurfaceAnalyze.csv
compare_data_file_reference      = PartAnalyze_ref.csv, SurfaceAnalyze_ref.csv
compare_data_file_tolerance      = 5E-2, 5E-2
compare_data_file_tolerance_type = relative, relative
! the two file names are a list of files, not a list of runs: compare both in every run
compare_data_file_one_diff_per_run = F
