# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage ".post": Collect documentation and coverage data
# ----------------------------------------------------------------------------------------------------------------------------------------------------
build_documentation:
  image: sphinxdoc/sphinx-latexpdf:latest
  stage: .post
  dependencies: []
  before_script:
    - echo "Skipping module loading in texlive Docker image."
  script:
    - python3 -m pip install -r docs/documentation/requirements.txt
    - python3 -m sphinx -T -E -b html  -D language=en docs/documentation html
    - python3 -m sphinx -T -E -b latex -D language=en docs/documentation latex
    - cd latex
    # latexmk will return non-zero exit codes even if the PDF was produced with warnings.
    - latexmk -r latexmkrc -pdf -f -dvi- -ps- -jobname=piclas -interaction=nonstopmode || true
    - test -s piclas.pdf
  rules:
    - !reference [.rules_not_for_deployment, rules]
    - when: on_success
  artifacts:
    paths:
      - html/
      - latex/piclas.pdf

code_coverage:
  stage: .post
  script:
    # combine coverage reports of all builds and runs in xml file for displaying coverage in mr diff view
    - FIND=$(cd Coverage; ls *.json)
    - echo -e "Using files:\n$FIND\nfor gcovr execution"
    - mkdir -p Coverage/cobertura
    - mkdir -p Coverage/html
    - gcovr --root ${PWD}/src --add-tracefile "Coverage/*.json" --xml Coverage/cobertura/coverage.xml --print-summary --merge-mode-functions=merge-use-line-min | tee Coverage/summary.txt
    # also in html format to check whole codebase by hand (easier to read compared to xml)
    - gcovr --root ${PWD}/src --add-tracefile "Coverage/*.json" --html-nested Coverage/html/coverage.html --merge-mode-functions=merge-use-line-min
    # Extract line coverage percentage from the summary (e.g. "lines: 85.3% (1234 out of 1446)")
    - COVERAGE=$(sed -nE 's/^lines:[[:space:]]+([0-9]+(\.[0-9]+)?)%.*/\1/p' Coverage/summary.txt)
    - if [ -z "$COVERAGE" ]; then echo "Could not extract coverage"; exit 1; fi
    # Produce a badge to use on the main PICLas page.
    - uvx anybadge --label=coverage --value="${COVERAGE}" --suffix="%" --file=coverage.svg 50=red 60=orange 80=yellow 90=green
  # regex expression the retrieve coverage percentage
  coverage: '/lines:\s+\d+(?:\.\d+)?%/'
  artifacts:
    paths:
      - Coverage/html
      # xml file (for debugging in gitlab merge diff view)
      - Coverage/cobertura/*.xml
      - coverage.svg
    expire_in: 1 month
    when: on_success
    reports:
      coverage_report:
        coverage_format: cobertura
        path: Coverage/cobertura/*.xml
  rules:
    - if: $[[ inputs.DO_CODE_COVERAGE ]] == true

reggie_coverage:
  stage: .post
  script:
    - echo "Generating coverage report for reggie..."
    - coverage html --data-file=${COVERAGE_REGGIE_DIR}/.coverage -d ${COVERAGE_REGGIE_DIR} ;
  artifacts:
    paths:
      # reggie coverage files
      - Coverage/reggie
    expire_in: 1 week
    when: on_success
  rules:
    - if: $[[ inputs.DO_REGGIE_COVERAGE ]] == true

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage ".post": Update release notes (if merging a branch into master.dev)
# ----------------------------------------------------------------------------------------------------------------------------------------------------
update_release_notes:
  stage: .post
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # do not run, when MR is created
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'             # do not run, when the pipeline has been scheduled
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'                  # do not run for manual pipelines from the web interface
      when: never
    - if: '$CI_COMMIT_BRANCH == "master.dev"'
  script:
    - |
      set -e
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      TMPFILE="/tmp/release-notes-${CI_JOB_ID:-$$}"

      echo "=== Automatic release notes ==="
      echo "Commit: ${CI_COMMIT_SHA}"
      echo "Branch: ${CI_COMMIT_BRANCH}"
      echo "API:    ${API}"
      echo ""

      # Find the merge request belonging to the current commit sha (assuming the default message "See merge request" has not been adapted)
      echo "--- Resolving merge request from commit message ---"
      COMMIT_MSG="$CI_COMMIT_MESSAGE"
      MR_IID=$(printf '%s\n' "$COMMIT_MSG" | grep -oE '![0-9]+' | head -n1 | tr -d '!')

      if [ -z "$MR_IID" ]; then
        echo "No merge request reference found in commit message, skipping"
        echo "Commit message: ${COMMIT_MSG}"
        exit 0
      fi

      echo "Found MR !${MR_IID}"

      # Safety check
      [[ "$MR_IID" =~ ^[0-9]+$ ]] || { echo "Could not determine MR IID: '$MR_IID'"; exit 1; }

      # Fetch MR details
      echo ""
      echo "--- Fetching MR !${MR_IID} details ---"
      curl -sf --header "PRIVATE-TOKEN: ${RELEASE_BOT_TOKEN}" \
        "${API}/merge_requests/${MR_IID}" \
        -o "${TMPFILE}-mr.json"

      MR_TITLE=$(jq -r '.title' "${TMPFILE}-mr.json")
      LABELS=$(jq -r '.labels[]' "${TMPFILE}-mr.json")
      SHORT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-8)

      # Strip branch name prefix like "[feature.branch] " from title
      MR_TITLE=$(echo "$MR_TITLE" | sed 's/^\[[^]]*\] *//')

      echo "Title:  ${MR_TITLE}"
      echo "SHA:    ${SHORT_SHA}"
      echo "Labels: $(echo "$LABELS" | tr '\n' ', ' | sed 's/,$//')"

      # Skip if explicitly excluded from release notes
      if echo "$LABELS" | grep -qi "^no-release-notes$"; then
        echo ""
        echo "Skipping (no-release-notes label found)"
        rm -f "${TMPFILE}-mr.json" "${TMPFILE}-rel.json"
        exit 0
      fi

      # Determine category from labels
      if echo "$LABELS" | grep -qi "^feature$"; then
        CATEGORY="Features"
      elif echo "$LABELS" | grep -qi "^improvement$"; then
        CATEGORY="Improvements"
      elif echo "$LABELS" | grep -qi "^bug$"; then
        CATEGORY="Fixes"
      else
        CATEGORY="Documentation/Tools/Regression Testing"
      fi
      echo "Category: ${CATEGORY}"

      # Find the open release MR (master.dev -> master)
      echo ""
      echo "--- Looking for open release MR (master.dev -> master) ---"
      curl -sf --header "PRIVATE-TOKEN: ${RELEASE_BOT_TOKEN}" \
        "${API}/merge_requests?state=opened&source_branch=master.dev&target_branch=master" \
        -o "${TMPFILE}-rel.json"

      REL_IID=$(jq -r '.[0].iid' "${TMPFILE}-rel.json")

      # If no open release MR exists, create one
      if [ "$REL_IID" = "null" ]; then
        echo "No open release MR found, creating one..."

        # Fetch the Release merge request template
        echo "Fetching Release template..."
        TEMPLATE=$(curl -sf --header "PRIVATE-TOKEN: ${RELEASE_BOT_TOKEN}" \
          "${API}/repository/files/.gitlab%2Fmerge_request_templates%2FRelease.md/raw?ref=master.dev")

        curl -sf --request POST \
          --header "PRIVATE-TOKEN: ${RELEASE_BOT_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n \
            --arg desc "$TEMPLATE" \
            '{
              source_branch: "master.dev",
              target_branch: "master",
              title: "Release X.X.X",
              description: $desc,
              labels: "Release"
            }')" \
          "${API}/merge_requests" \
          -o "${TMPFILE}-rel.json"

        REL_IID=$(jq -r '.iid' "${TMPFILE}-rel.json")

        if [ "$REL_IID" = "null" ]; then
          echo "ERROR: Failed to create release MR"
          jq . "${TMPFILE}-rel.json"
          rm -f "${TMPFILE}-mr.json" "${TMPFILE}-rel.json"
          exit 1
        fi

        echo "Created release MR !${REL_IID}"
        DESC=$(jq -r '.description // ""' "${TMPFILE}-rel.json")
      else
        echo "Found release MR !${REL_IID}"
        DESC=$(jq -r '.[0].description // ""' "${TMPFILE}-rel.json")
      fi

      # Avoid duplicates (check by commit hash)
      if echo "$DESC" | grep -q "\[${SHORT_SHA}\]"; then
        echo ""
        echo "Entry with commit [${SHORT_SHA}] already exists, skipping"
        rm -f "${TMPFILE}-mr.json" "${TMPFILE}-rel.json"
        exit 0
      fi

      # Build entry safely using jq (handles all escaping)
      ENTRY=$(jq -n -r --arg title "$MR_TITLE" --arg sha "$SHORT_SHA" '"* \($title) [\($sha)]"')

      HEADING="### ${CATEGORY}"

      echo ""
      echo "--- Updating release MR !${REL_IID} ---"
      echo "Heading: ${HEADING}"
      echo "Entry:   ${ENTRY}"

      # Insert entry under the correct heading, or create it
      if echo "$DESC" | grep -q "^${HEADING}$"; then
        echo "Found existing heading, inserting entry..."
        export HEADING ENTRY
        UPDATED=$(echo "$DESC" | awk '
          BEGIN { heading=ENVIRON["HEADING"]; entry=ENVIRON["ENTRY"]; blanks=0 }
          {
            if ($0 == heading) {
              found=1; print; next
            }
            if (found && !inserted) {
              if (/^[[:space:]]*$/) {
                blanks++
                next
              }
              if (/^### /) {
                print entry
                for (i=0; i<blanks; i++) print ""
                blanks=0
                inserted=1
              } else {
                for (i=0; i<blanks; i++) print ""
                blanks=0
              }
            }
            print
          }
          END { if (found && !inserted) print entry }
        ')
      else
        echo "Heading not found, appending new section..."
        UPDATED=$(printf '%s\n\n%s\n%s' "$DESC" "$HEADING" "$ENTRY")
      fi

      # Update the release MR description
      curl -sf --request PUT \
        --header "PRIVATE-TOKEN: ${RELEASE_BOT_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n --arg d "$UPDATED" '{description: $d}')" \
        "${API}/merge_requests/${REL_IID}" > /dev/null

      # Instead of updating, just show what would happen
      # echo "DRY RUN - would add to !${REL_IID}:"
      # echo "$ENTRY"
      # echo ""
      # echo "Full updated description:"
      # echo "$UPDATED"

      # Clean up
      rm -f "${TMPFILE}-mr.json" "${TMPFILE}-rel.json"

      echo ""
      echo "Added to !${REL_IID} under ${CATEGORY}: ${ENTRY}"

