# ------------------------------------------------------------------------ ----------------------------------------------------------------------------
# Stage "github": Push the master branch to github
# ----------------------------------------------------------------------------------------------------------------------------------------------------
github:
  stage: deploy
  tags: [deploy]
  rules:
    - if: $[[ inputs.DO_DEPLOY ]] == true
  script:
    - if [ "$[[ inputs.DO_DEPLOY ]]" == "false" ]; then exit ; fi
    - rm -rf piclas_github || true ;
    - git clone -b master --single-branch git@piclas.boltzplatz.eu:piclas/piclas.git piclas_github ;
    - cd piclas_github ;
    - git remote add piclas-framework git@github.com:piclas-framework/piclas.git ;
    - git push --force --follow-tags piclas-framework master ;

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "appimage": Push the CI_COMMIT_REF_NAME branch to github to invoke creating the AppImages
# ----------------------------------------------------------------------------------------------------------------------------------------------------
github_create_appimage:
  tags: [appimage]
  stage: appimage
  rules:
    - if: $[[ inputs.DO_CREATE_APPIMAGE ]] == true
  script:
    - if [ "$[[ inputs.DO_CREATE_APPIMAGE ]]" == "false" ]; then exit; fi
    - if [ -z "${CI_COMMIT_REF_NAME}" ]; then echo "CI_COMMIT_REF_NAME is empty"; exit; else echo "Cloning ${CI_COMMIT_REF_NAME}"; fi
    - rm -rf piclas-testing || true ;
    - git clone -b ${CI_COMMIT_REF_NAME} --single-branch git@piclas.boltzplatz.eu:piclas/piclas.git piclas-testing
    - cd piclas-testing
    - git remote add piclas-testing git@github.com-reggie2.0:scopplestone/piclas-testing.git
    - git push --force piclas-testing ${CI_COMMIT_REF_NAME}

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "appimage": Download the AppImages from the piclas-testing repository and test them
# ----------------------------------------------------------------------------------------------------------------------------------------------------
github_test_appimage:
  tags: [appimage]
  stage: appimage
  rules:
    - if: '"$[[ inputs.DO_TEST_APPIMAGE ]]" != ""'
  script:
    - if [ -z '$[[ inputs.DO_TEST_APPIMAGE ]]' ]; then echo "DO_TEST_APPIMAGE is empty but should contain the artifact name"; exit; else echo "Artifact $[[ inputs.DO_TEST_APPIMAGE ]]"; fi
    - if [ -z "${CI_COMMIT_REF_NAME}" ]; then echo "CI_COMMIT_REF_NAME is empty"; exit; else echo "Cloning ${CI_COMMIT_REF_NAME}"; fi
    - deactivate || true
    - rm -rf venv-reggie-appimage reggie-appimage
    - python3 -m venv venv-reggie-appimage
    - pwd
    - pip --version || true
    - source venv-reggie-appimage/bin/activate
    - python3 -m ensurepip
    - pip --version
    - git clone git@github.com:reggie-framework/reggie.git reggie-appimage ;
    - if [ -d "reggie-appimage" ]; then cd reggie-appimage ; pip install -e . ; cd .. ; fi ;
    - git clone --single-branch --branch main git@github.com:hopr-framework/PyHOPE pyhope-appimage  # NIG_SuperB requires pyhope for building the .h5 mesh file
    - if [ -d "pyhope-appimage" ]; then cd pyhope-appimage ; pip install -e . ; cd .. ; fi ;
    - module pu && module load gcc/16.1.0 openmpi/4.1.6/gcc/16.1.0
    - rm -rf piclas-testing || true ;
    - git clone -b ${CI_COMMIT_REF_NAME} --single-branch git@github.com-reggie2.0:scopplestone/piclas-testing.git piclas-testing
    - cd piclas-testing
    - echo "Downloading '$[[ inputs.DO_TEST_APPIMAGE ]]' artifacts from piclas-testing via 'gh run download -n $[[ inputs.DO_TEST_APPIMAGE ]]'"
    - source /var/lib/gitlab-runner/.bashrc  # loads gh token
    - gh --version
    - gh run download -n $[[ inputs.DO_TEST_APPIMAGE ]]
    - ls -l
    - module li
    - echo "Checking ./piclasLeapfrogHDG executable output"
    - ./piclasLeapfrogHDG --help | head -n 12 || true
    - which mpirun
    - echo "Running ./../tools/testAppImages.sh . regressioncheck"
    - ./../tools/testAppImages.sh . regressioncheck