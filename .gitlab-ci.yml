# define gitlab ci/cd inputs for pipeline, these values are set at pipeline creation and cannot be changed afterwards
spec:
  inputs:
    SCHEDULE:
      default: 'CHECKIN'
      options: ['CHECKIN', 'NIGHTLY', 'WEEKLY']
      description: "Run check-in (short), nightly (longer) or weekly (very long) regressiontests"

    SHARED_MEMORY:
      default: 'MPI_COMM_TYPE_SHARED'
      options: ['MPI_COMM_TYPE_SHARED', 'PICLAS_COMM_TYPE_NODE', 'OMPI_COMM_TYPE_CORE']
      description: "OMPI_COMM_TYPE_CORE: core-level, PICLAS_COMM_TYPE_NODE: virtual node-level splitting with 2 core per node, MPI_COMM_TYPE_SHARED: physical node-level (default)"

    DO_NINJA:
      type: boolean
      description: "Use Ninja generator for CMake"
      default: false

    MPI:
      default: 'Alternate'
      options: ['Alternate', 'OpenMPI', 'MPICH', 'MPICH Debug']
      description: "MPI implementation to load. 'Alternate' uses OpenMPI on even days and MPICH on odd days."

    DO_CODE_COVERAGE:
      type: boolean
      description: "Enable code coverage and report generation"
      default: false

    DO_REGGIE_COVERAGE:
      type: boolean
      description: "Enable code coverage for reggie functions"
      default: false

    DO_RUN_LOCAL:
      type: string
      description: "Set specific set of modules to load for local execution"
      default: ""

    DO_CREATE_APPIMAGE:
      type: boolean
      description: "Push the CI_COMMIT_REF_NAME branch to github to invoke creating the AppImages"
      default: false

    DO_TEST_APPIMAGE:
      type: string
      description: "Download the AppImages from the piclas-testing repository and test them"
      default: ""

    DO_DEPLOY:
      type: boolean
      description: "Deployment of the master.dev to GitHub"
      default: false

    CHECK_WARNINGS:
      type: boolean
      description: "Check number of warnings after compiling and exit for more than nine errors"
      default: false
---
variables:
  # Use a fresh clone every time. This costs a few seconds, but greatly improves reproducability
  # It is especially helpful after tests where we remove the .git directory.
  GIT_STRATEGY: clone
  # The project directory will be cleaned up at the end of the build
  FF_ENABLE_JOB_CLEANUP: true
  # The trace force send interval for logs is dynamically adjusted based on the trace update interval
  FF_USE_DYNAMIC_TRACE_FORCE_SEND_INTERVAL: true
  # Use fast compression for artifacts, resulting in larger archives
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  # Use no compression for caches
  CACHE_COMPRESSION_LEVEL: "fastest"

  # --- label table for the pipeline name
  L_SCHEDULE_CHECKIN: '[CHE]'
  L_SCHEDULE_NIGHTLY: '[NIG]'
  L_SCHEDULE_WEEKLY:  '[WEK]'

  L_MEM_MPI_COMM_TYPE_SHARED:  'shared memory'
  L_MEM_PICLAS_COMM_TYPE_NODE: 'node splitting'
  L_MEM_OMPI_COMM_TYPE_CORE:   'core splitting'

  L_MEM_MPI_COMM_TYPE_SHARED_COLOR:  '🟢'
  L_MEM_PICLAS_COMM_TYPE_NODE_COLOR: '🔵'
  L_MEM_OMPI_COMM_TYPE_CORE_COLOR:   '🟠'

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Set pipeline name to indicate whether default shared memory, node split or core split is used, and whether it is a checkin, nightly or weekly pipeline
# ----------------------------------------------------------------------------------------------------------------------------------------------------
workflow:
  # Compose the pipeline name from the per-value labels defined in `variables` above
  name: '${L_SCHEDULE_$[[ inputs.SCHEDULE ]]}${L_MEM_$[[ inputs.SHARED_MEMORY ]]_COLOR} ${CI_COMMIT_REF_NAME} (${MPI_FLAVOUR}, ${L_MEM_$[[ inputs.SHARED_MEMORY ]]})'
  rules:
    # These awful awful regexes determine whether it is an odd or even day. Since we want to show the MPI implementation we are using in
    # the pipeline name, we are reliant on using non-shell methods.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TIMESTAMP =~ /^\d{4}-\d{2}-\d[13579]T/ && "$[[ inputs.MPI ]]" == "Alternate"
      variables:
        MPI_FLAVOUR: "MPICH"
    - if: $CI_COMMIT_TIMESTAMP =~ /^\d{4}-\d{2}-\d[02468]T/ && "$[[ inputs.MPI ]]" == "Alternate"
      variables:
        MPI_FLAVOUR: "OpenMPI"
    - variables:
        MPI_FLAVOUR: $[[ inputs.MPI ]]

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Prepare execution environment
# ----------------------------------------------------------------------------------------------------------------------------------------------------
default:
  tags: [withmodules-concurrent-new]
  # Cache self-built HDF5 (LIBS_BUILD_HDF5=ON).
  # HDF5 is built against the MPI flavour chosen for this pipeline, so reusing it across pipelines is unsafe.
  cache:
    key: "hdf5-${CI_PIPELINE_ID}"
    paths:
      - share/*/HDF5
  before_script:
    - export MESHESDIR=True
    - export REGGIE_GITLAB_CI=1
    - nproc
    - ulimit -Ss 32768
    # Output diagnostics to log
    # - export PATH="/var/lib/gitlab-runner/.local/bin:$PATH"
    - python  -V || true
    - python3 -V || true
    - pip --version || true
    # Setup python environment for runner
    - python -m venv venv
    - source venv/bin/activate
    - python -m pip install uv
    - uv pip install setuptools wheel pytest pytest-cov
    - uv pip install git+https://github.com/lte678/reggie.git@fix.docker-corecount
    - uv pip install https://github.com/hopr-framework/PyHOPE/releases/latest/download/gmsh-4.15.2.post1-py3-none-linux_x86_64.whl
    - uv pip install git+https://github.com/hopr-framework/PyHOPE.git@main
    - which reggie
    - which pyhope
    # Configure modules
    - if [ "$[[ inputs.SHARED_MEMORY ]]" == "OMPI_COMM_TYPE_CORE" ]; then
        echo "PICLAS_SPLIT_TYPE=OMPI_COMM_TYPE_CORE. Splitting shared memory domains on processor level (\"core splitting\")";
        export PICLAS_SPLIT_TYPE=OMPI_COMM_TYPE_CORE;
      else
        if [ "$[[ inputs.SHARED_MEMORY ]]" == "PICLAS_COMM_TYPE_NODE" ]; then
          echo "PICLAS_SPLIT_TYPE=PICLAS_COMM_TYPE_NODE. Splitting shared memory domains on sub-node level with 2 cores per node (\"node splitting\")!";
          export PICLAS_SPLIT_TYPE=PICLAS_COMM_TYPE_NODE;
        else
          echo "PICLAS_SHARED_MEMORY=MPI_COMM_TYPE_SHARED. Splitting shared memory domains on physical node level (default)!";
          echo "Set input OMPI_COMM_TYPE_CORE to force core-level OR PICLAS_COMM_TYPE_NODE to force sub-node-level shared memory splitting for all regression tests.";
        fi
      fi
    - if [ "$[[ inputs.DO_NINJA ]]" == "true" ]; then
        export CMAKE_GENERATOR="Ninja";
        export FLAG_NCORES="";
      else
        export CMAKE_GENERATOR="Unix Makefiles";
        export FLAG_NCORES="-j";
      fi
    - echo "Setting CMAKE_GENERATOR=${CMAKE_GENERATOR}"
    - echo "Loading ${MPI_FLAVOUR}."
    - if [ "${MPI_FLAVOUR}" == "OpenMPI" ]; then
        module purge || true;
        module load  cmake/4.3.3  gcc/16.1.0  openmpi/5.0.9/gcc/16.1.0      hdf5/2.2.0/gcc/16.1.0/openmpi/5.0.9      petsc/3.25.1/gcc/16.1.0/openmpi/5.0.9 || true;
      elif [ "${MPI_FLAVOUR}" == "MPICH" ]; then
        module purge || true;
        module load  cmake/4.3.3  gcc/16.1.0  mpich/5.0.1/gcc/16.1.0        hdf5/2.2.0/gcc/16.1.0/mpich/5.0.1        petsc/3.25.1/gcc/16.1.0/mpich/5.0.1 || true;
      elif [ "${MPI_FLAVOUR}" == "MPICH Debug" ]; then
        echo "Loading MPICH with --with-device=ch3:sock which allows over-subscription without performance loss but cannot be used for shared memory arrays safely!";
        module purge || true;
        module load  cmake/3.26.4  gcc/13.2.0  mpich-debug/4.1.2/gcc/13.2.0  hdf5/1.14.0/gcc/13.2.0/mpich-debug/4.1.2  hopr/master/gcc/13.2.0/mpich-debug/4.1.2/hdf5/1.14.0  petsc/3.21.6/gcc/13.2.0/mpich-debug/4.1.2;
      fi
      # else
      #   module load openblas/v0.3.31/gcc/14.2.0;
    - if [ -n "$[[ inputs.DO_RUN_LOCAL ]]" ]; then
        source $(ls /opt/modules/*/init/bash | tail -n1);
        for LOCALMODULE in $[[ inputs.DO_RUN_LOCAL ]]; do module load ${LOCALMODULE}; done;
        module list;
      else
        module list || true ;
      fi
    # GCOVR_ARGS: - use --include-internal-functions to include all functions starting with '__' (basically every function in piclas)
    #             - --gcov-ignore-parse-errors Skip lines with parse errors in GCOV files instead of exiting with an error
    #             - --exclude-lines-by-pattern exclude all lines that start with the regex pattern. Called multiple times for no and one or more (^\s+) leading whitespaces since reggie execution expands wildcards
    # CODE_COVERAGE signals reggie to produce coverage artifacts, PICLAS_CODE_COVERAGE does the same for the PICLas CMake toolchain
    - if [ "$[[ inputs.DO_CODE_COVERAGE ]]" == "true" ]; then
        mkdir -p Coverage ;
        export CODE_COVERAGE=True;
        export PICLAS_CODE_COVERAGE=ON ;
        echo "PICLAS_CODE_COVERAGE=ON" ;
        export GCOVR_ARGS='--include-internal-functions --gcov-ignore-parse-errors all --exclude-lines-by-pattern (?i)^\s+CALL\s+collectivestop --exclude-lines-by-pattern (?i)^CALL\s+collectivestop --exclude-lines-by-pattern (?i)^\s+CALL\s+ABORT --exclude-lines-by-pattern (?i)^CALL\s+ABORT';
      fi
    - |
      if [ "$[[ inputs.DO_REGGIE_COVERAGE ]]" == "true" ]; then
        mkdir -p Coverage/reggie ;
        echo "DO_REGGIE_COVERAGE activated. Creating Coverage/reggie to store coverage report.";
        COVERAGE_REGGIE_DIR="${PWD}/Coverage/reggie" ;
        reggie() {
          coverage run -a --data-file=${COVERAGE_REGGIE_DIR}/.coverage --source=reggie -m reggie.reggie "$@"
        }
        echo "Exporting reggie function call to 'coverage run -a --data-file=${COVERAGE_REGGIE_DIR}/.coverage --source=reggie -m reggie.reggie "$@"' to get coverage data."
        export -f reggie
      fi

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stages
# ----------------------------------------------------------------------------------------------------------------------------------------------------
stages:
  - lint
  - tools
  - build
  - build_weekly
  - reggie_checkin_short
  - reggie_checkin_long
  - reggie_DSMC_nightly
  - reggie_tools_nightly
  - reggie_nightly_checkin
  - reggie_nightly_special
  - reggie_nightly
  - reggie_weekly
  - reggie_tutorials
  - deploy
  - appimage

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Templates (hidden jobs and combined per job via `extends`)
# ----------------------------------------------------------------------------------------------------------------------------------------------------

# Cadence rules
.rules_not_for_deployment:
  rules:
    # If the pipeline is for an appimage test run, the job is not added to the pipeline.
    - if: '"$[[ inputs.DO_TEST_APPIMAGE ]]" != ""'
      when: never
    # If the pipeline is for an appimage build run, the job is not added to the pipeline.
    - if: $[[ inputs.DO_CREATE_APPIMAGE ]] == true
      when: never
    # If the pipeline is for pushing the master branch to GitHub
    - if: $[[ inputs.DO_DEPLOY ]] == true
      when: never

.rules_checkin:
  rules:
    - !reference [.rules_not_for_deployment, rules]
    - if: '"$[[ inputs.SCHEDULE ]]" == "CHECKIN"'

.rules_nightly:
  rules:
    - !reference [.rules_not_for_deployment, rules]
    - if: '"$[[ inputs.SCHEDULE ]]" == "NIGHTLY"'

.rules_weekly:
  rules:
    - !reference [.rules_not_for_deployment, rules]
    - if: '"$[[ inputs.SCHEDULE ]]" == "WEEKLY"'

# Some reggies only work with the default (physical node level) shared memory splitting, e.g. ray tracing
.rules_nightly_single_node:
  rules:
    - if: '"$[[ inputs.SHARED_MEMORY ]]" == "OMPI_COMM_TYPE_CORE"'
      when: never
    - if: '"$[[ inputs.SHARED_MEMORY ]]" == "PICLAS_COMM_TYPE_NODE"'
      when: never
    - !reference [.rules_nightly, rules]

.rules_weekly_single_node:
  rules:
    - if: '"$[[ inputs.SHARED_MEMORY ]]" == "OMPI_COMM_TYPE_CORE"'
      when: never
    - if: '"$[[ inputs.SHARED_MEMORY ]]" == "PICLAS_COMM_TYPE_NODE"'
      when: never
    - !reference [.rules_weekly, rules]

.build_defaults:
  dependencies: []
  artifacts:
    name: "${CI_PIPELINE_ID}-${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}"
    expire_in: 1 day
    when: always
  rules:
    # Do not perform build steps if deploying
    - !reference [.rules_not_for_deployment, rules]
    - when: on_success

.lint_defaults:
  dependencies: []
  rules:
    # Do not perform lint steps if deploying
    - !reference [.rules_not_for_deployment, rules]
    # policy: allow linting to fail without terminating the pipeline on feature branches
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      allow_failure: true
    - when: on_success

# Reggie execution template
.reggie:
  variables:
    REGGIE_ARGS: ""
    # If specified, reggie will not perform a new build. Point to top-level build directory.
    USE_BUILD: ""
    # If set to true, coverage will be skipped for this job, irregardless of DO_CODE_COVERAGE.
    SKIP_COVERAGE: "false"
  artifacts:
    paths: [Coverage]
    expire_in: 1 day
    when: always
  script:
    # reggie writes tracefiles to $CI_PROJECT_DIR/../Coverage when CODE_COVERAGE is set. TODO: Change this
    - rm -rf Coverage ../Coverage
    - |
      if [ "${SKIP_COVERAGE}" == "true" ]; then
        echo "SKIP_COVERAGE is set, disabling code coverage for this job."
        unset CODE_COVERAGE PICLAS_CODE_COVERAGE
      fi
      if [ -n "${USE_BUILD}" ]; then
        reggie ${REGGIE_ARGS} -e "${USE_BUILD}/bin/piclas" "regressioncheck/${REGGIE_CASE}"
      else
        reggie ${REGGIE_ARGS} "regressioncheck/${REGGIE_CASE}"
      fi
      if [ "$[[ inputs.DO_CODE_COVERAGE ]]" == "true" ]; then
        mkdir -p Coverage
        for f in ../Coverage/combined_report_*.json; do
          [ -e "$f" ] && cp "$f" "Coverage/${CI_JOB_NAME_SLUG}.json"
        done
      fi
  allow_failure: true

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "lint"
# ----------------------------------------------------------------------------------------------------------------------------------------------------
fortitude:
  extends: .lint_defaults
  stage: lint
  script:
    - uv pip install fortitude-lint==0.9.2
    - fortitude --version
    - fortitude check --output-format=grouped src
    - fortitude check src --statistics --quiet

ruff:
  extends: .lint_defaults
  stage: lint
  script:
    - pwd
    - uv pip install ruff==0.16.7
    - ruff --version
    - ruff check --config pyproject.toml --preview
    - ruff check --config pyproject.toml --preview --statistics

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "tools": Test the scripts in the tools directory
# ----------------------------------------------------------------------------------------------------------------------------------------------------
createCylinderHOPR.py:
  extends: .build_defaults
  stage: tools
  script:
    - |
      set +o pipefail  # the pipeline only fails if the last command fails (default bash behavior)
      cd tools/createCylinderHOPR
      # prepare the config file
      echo '{"ik": 1,"ir": 2,"iz": 1,"lz": 1.0,"mode": 3,"periodic": 0,"pyhope": "pyhope","r1": 0.5,"r2": 1.0}' > .createCylinderHOPR.json
      # yes '' keeps sending empty strings, so every input() call gets an empty response automatically
      yes '' | python createCylinderHOPR.py  # this fails because yes exits 1 (broken pipe). Therefore, set +o pipefail to ignore that

updatePiclasVersion.sh:
  extends: .build_defaults
  stage: tools
  script:
    - rm -rf tools-testing/updatePiclasVersion || true
    - mkdir -p tools-testing/updatePiclasVersion
    - cp --parents ./src/globals/globals_vars.f90 tools-testing/updatePiclasVersion
    - cp --parents .github/workflows/cmake-ninja.yml tools-testing/updatePiclasVersion
    - cp CMakeLists.txt fpm.toml CITATION.cff tools-testing/updatePiclasVersion
    - cd tools-testing/updatePiclasVersion
    - ../../tools/updatePiclasVersion.sh 1.0.0
    - diff CMakeLists.txt ../../CMakeLists.txt > diff.log || true  # diff returns exit code 1 when files differ
    - diff fpm.toml ../../fpm.toml >> diff.log || true  # diff returns exit code 1 when files differ
    - diff CITATION.cff ../../CITATION.cff >> diff.log || true  # diff returns exit code 1 when files differ
    - diff ./src/globals/globals_vars.f90 ../.././src/globals/globals_vars.f90 >> diff.log || true  # diff returns exit code 1 when files differ
    - diff .github/workflows/cmake-ninja.yml ../../.github/workflows/cmake-ninja.yml >> diff.log || true  # diff returns exit code 1 when files differ
    - NBROFDDIFFS=$(wc -l < diff.log)
    - cat diff.log
    - echo "$NBROFDDIFFS"
    - if [[ "$NBROFDDIFFS" != 26 ]]; then echo "There should be 26 diffs."; exit 1; fi

userblock:
  extends: .build_defaults
  stage: tools
  script:
    - rm -rf tools-testing/userblock || true
    - mkdir -p tools-testing/userblock
    - cd tools-testing/userblock
    - python ../../tools/userblock/extract_userblock.py ../../regressioncheck/NIG_tracking_DSMC/curved/Cylinder_State_000.00000000000000000.h5
    - grep -oP '(?<=\{\[\( )[^)]+(?= \)\]\})' userblock.txt

convertHoprToPyHopeIni.sh:
  extends: .build_defaults
  stage: tools
  script:
    - rm -rf tools-testing/convertHoprToPyHopeIni || true
    - mkdir -p tools-testing/convertHoprToPyHopeIni
    - cd tools-testing/convertHoprToPyHopeIni
    - ../../tools/convertHoprToPyHopeIni.sh --help

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "build": Build on check-in
# ----------------------------------------------------------------------------------------------------------------------------------------------------
build_default:
  extends: .build_defaults
  stage: build
  artifacts:
    paths: [build]
  script:
    - cmake -GNinja -B build -DLIBS_BUILD_HDF5=OFF -DPICLAS_BUILD_POSTI=ON -DPOSTI_BUILD_SUPERB=ON -DPICLAS_READIN_CONSTANTS=ON
    - cmake --build build $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build

build_maxwell_only:
  extends: .build_defaults
  stage: build
  artifacts:
    paths: [build_maxwell_only]
  script:
    - cmake -B build_maxwell_only  -DCMAKE_BUILD_TYPE=Debug -DPICLAS_DEBUG_MEMORY=ON -DPICLAS_PARTICLES=OFF -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON
    - cmake --build build_maxwell_only $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_poisson:
  extends: .build_defaults
  stage: build
  artifacts:
    paths:
      - build_poisson_release_RK3
      - build_poisson_release_Leapfrog
      - build_poisson_debug_RK3
      - build_poisson_debug_Leapfrog
  script:
    - cmake -B build_poisson_release_RK3 -DCMAKE_BUILD_TYPE=Release -DPICLAS_EQNSYSNAME=poisson -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=RK3 -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_release_RK3 $FLAG_NCORES -t all
    - cmake -B build_poisson_debug_RK3 -DCMAKE_BUILD_TYPE=Debug -DPICLAS_EQNSYSNAME=poisson -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=RK3 -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_debug_RK3 $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    # Check greater than 10, see https://regex101.com/ for details
    # - if [[ "$NWARN" =~ ^(1[1-9]|[2-9]+\d+|1\d\d+)$ ]]; then
    # Check greater than 9, see https://regex101.com/ for details
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - cmake -B build_poisson_release_Leapfrog -DCMAKE_BUILD_TYPE=Release -DPICLAS_EQNSYSNAME=poisson -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_release_Leapfrog $FLAG_NCORES -t all
    - cmake -B build_poisson_debug_Leapfrog -DCMAKE_BUILD_TYPE=Debug -DPICLAS_EQNSYSNAME=poisson -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_debug_Leapfrog $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    - if [ -n "$WARN" ]; then echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; fi
    # Check greater than 10, see https://regex101.com/ for details
    # - if [[ "$NWARN" =~ ^(1[1-9]|[2-9]+\d+|1\d\d+)$ ]]; then
    # Check greater than 9, see https://regex101.com/ for details
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_poisson_petsc:
  extends: .build_defaults
  stage: build
  artifacts:
    paths:
      - build_poisson_petsc_release_RK3
      - build_poisson_petsc_release_Leapfrog
      - build_poisson_petsc_debug_RK3
      - build_poisson_petsc_debug_Leapfrog
  script:
    - cmake -B build_poisson_petsc_release_RK3 -DCMAKE_BUILD_TYPE=Release -DPICLAS_EQNSYSNAME=poisson -DLIBS_USE_PETSC=ON -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=RK3 -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_petsc_release_RK3 $FLAG_NCORES -t all
    - cmake -B build_poisson_petsc_debug_RK3 -DCMAKE_BUILD_TYPE=Debug -DPICLAS_EQNSYSNAME=poisson -DLIBS_USE_PETSC=ON -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=RK3 -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_petsc_debug_RK3  $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - cmake -B build_poisson_petsc_release_Leapfrog  -DCMAKE_BUILD_TYPE=Release -DPICLAS_EQNSYSNAME=poisson -DLIBS_USE_PETSC=ON -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_poisson_petsc_release_Leapfrog $FLAG_NCORES -t all
    - cmake -B build_poisson_petsc_debug_Leapfrog -DCMAKE_BUILD_TYPE=Debug -DPICLAS_EQNSYSNAME=poisson -DLIBS_USE_PETSC=ON -DPICLAS_CODE_ANALYZE=ON -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON
    - cmake --build build_poisson_petsc_debug_Leapfrog $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_DSMC:
  extends: .build_defaults
  stage: build
  artifacts:
    paths:
      - build_DSMC_release
      - build_DSMC_debug
      - build_DSMC_N1
      - build_radiation
  script:
    - cmake -B build_DSMC_release  -DCMAKE_BUILD_TYPE=Release -DPICLAS_TIMEDISCMETHOD=DSMC -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_DSMC_release  $FLAG_NCORES -t all
    - cmake -B build_DSMC_debug  -DCMAKE_BUILD_TYPE=Debug -DPICLAS_TIMEDISCMETHOD=DSMC -DLIBS_BUILD_HDF5=OFF
    - cmake --build build_DSMC_debug  $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - if [ "$[[ inputs.SCHEDULE ]]" == "WEEKLY" ] ; then
        cmake -B build_DSMC_N1 -DCMAKE_BUILD_TYPE=Release -DPICLAS_TIMEDISCMETHOD=DSMC -DLIBS_BUILD_HDF5=OFF -DPICLAS_POLYNOMIAL_DEGREE=1 ;
        cmake --build  build_DSMC_N1 $FLAG_NCORES -t all ;
      fi
    - if [ "$[[ inputs.SCHEDULE ]]" == "WEEKLY" ] ; then
        cmake -B build_radiation -DLIBS_BUILD_HDF5=OFF -DPICLAS_BUILD_POSTI=ON -DPOSTI_BUILD_SUPERB=ON -DPICLAS_READIN_CONSTANTS=ON -DPICLAS_TIMEDISCMETHOD=Radiation -DPICLAS_INTKIND8=ON ;
        cmake --build  build_radiation $FLAG_NCORES -t all ;
      fi
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_drift_diffusion:
  extends: .build_defaults
  stage: build
  artifacts:
    paths: [build_drift_diffusion]
  script:
    - cmake -B build_drift_diffusion -DCMAKE_BUILD_TYPE=Debug -DPICLAS_DEBUG_MEMORY=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DPICLAS_EQNSYSNAME=drift_diffusion -DPICLAS_TIMEDISCMETHOD=Explicit-FV -DLIBS_USE_PETSC=ON
    - cmake --build build_drift_diffusion $FLAG_NCORES -t all 2>&1 | tee compile_output.txt
    - WARN=$(grep "Warning:" compile_output.txt || true); if [ -n "$WARN" ]; then NWARN=$(echo "$WARN" | wc -l); echo "Found the following compiler warnings:"; echo "$WARN"; echo "Found $NWARN warning(s)"; else NWARN=0; fi
    - if [[ "$NWARN" =~ ^[1-9][0-9]+$ ]]; then
        if [ "$[[ inputs.CHECK_WARNINGS ]]" == "true" ]; then echo "More than 9 warnings are not allowed. Fix the warnings and re-run the regression test."; exit 1 ; fi ;
      fi
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_DVM:
  extends: .build_defaults
  stage: build
  artifacts:
    paths: [build_DVM]
  script:
    - cmake -B build_DVM -DCMAKE_BUILD_TYPE=Debug -DPICLAS_DEBUG_MEMORY=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DPICLAS_EQNSYSNAME=discrete_velocity -DPICLAS_TIMEDISCMETHOD=ED-DVM -DPICLAS_PARTICLES=OFF
    - cmake --build build_DVM $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_DVM_plasma:
  extends: .build_defaults
  stage: build
  artifacts:
    paths: [build_DVM_plasma]
  script:
    - cmake -B build_DVM_plasma -DCMAKE_BUILD_TYPE=Debug -DPICLAS_DEBUG_MEMORY=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DPICLAS_EQNSYSNAME=discrete_velocity -DPICLAS_TIMEDISCMETHOD=PLOESMA -DPICLAS_PARTICLES=OFF -DLIBS_USE_PETSC=ON
    - cmake --build build_DVM_plasma $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_no_git:
  extends: [.build_defaults, .rules_weekly]
  stage: build_weekly
  # No artifacts. We won't use this binary.
  script:
    - rm -rf .git*
    - if git rev-parse --show-toplevel 2>/dev/null ; then echo "ERROR - found a parent git repository, no-git test environment is not clean" ; exit 1 ; fi
    - cmake -B build -DLIBS_BUILD_HDF5=OFF
    - cmake --build build $FLAG_NCORES -t all

build_outside_repository:
  extends: [.build_defaults, .rules_weekly]
  stage: build_weekly
  script:
    - echo " Installing branch $CI_COMMIT_REF_NAME outside the piclas directory/repository"
    - REPOPATH=$(echo `pwd`)
    - cd .. ;
    - cmake -B build-piclas-outside ${REPOPATH} -DLIBS_BUILD_HDF5=OFF
    - cmake --build build-piclas-outside $FLAG_NCORES -t all
    - rm -r build-piclas-outside

build_no_git_libs:
  extends: [.build_defaults, .rules_weekly]
  stage: build_weekly
  # No artifacts. We won't need this binary
  script:
    - rm -rf .git*
    - if git rev-parse --show-toplevel 2>/dev/null ; then echo "ERROR - found a parent git repository, no-git test environment is not clean" ; exit 1 ; fi
    - cmake -B build -DLIBS_BUILD_HDF5=ON -DLIBS_BUILD_MATH_LIB=ON -DLIBS_BUILD_MATH_LIB_VENDOR=OpenBLAS
    - cmake --build build $FLAG_NCORES -t all > cmake-build-output.txt 2>&1
    - tail -n 100 cmake-build-output.txt

build_petsc_in_piclas:
  extends: [.build_defaults, .rules_weekly]
  stage: build_weekly
  artifacts:
    paths:
      - build_petsc_lib
  script:
    - cmake -B build_petsc_lib -DPICLAS_EQNSYSNAME=poisson -DPICLAS_TIMEDISCMETHOD=RK3 -DPICLAS_CODE_ANALYZE=ON -DLIBS_BUILD_HDF5=OFF -DLIBS_USE_PETSC=ON -DLIBS_BUILD_PETSC=ON
    - echo " Compiling with Poisson, RK3 and self-built PETSc (-DPICLAS_EQNSYSNAME=poisson -DPICLAS_TIMEDISCMETHOD=RK3 -DLIBS_USE_PETSC=ON -DLIBS_BUILD_PETSC=ON) ..."
    - cmake --build build_petsc_lib $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build_*

build_Leapfrog_PGO:
  extends: [.build_defaults, .rules_weekly]
  stage: build_weekly
  artifacts:
    paths:
      - build_Leapfrog_PGO
  script:
    # The --coverage option is not compatible with the PGO -fprofile-use option. Both attempt to put their results into the same .gcda file, however this is undesirable.
    - unset CODE_COVERAGE PICLAS_CODE_COVERAGE
    - cmake -B build_Leapfrog_PGO -DPICLAS_EQNSYSNAME=poisson -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF -DLIBS_USE_PETSC=ON -DPICLAS_PERFORMANCE=ON -DUSE_PGO=ON -DCMAKE_BUILD_TYPE=Profile
    - echo " Preparing PGO profiling run by compiling with -DPICLAS_PERFORMANCE=ON -DUSE_PGO=ON -DCMAKE_BUILD_TYPE=Profile"
    - cmake --build build_Leapfrog_PGO $FLAG_NCORES -t all
    - cd build_Leapfrog_PGO && reggie -e ./bin/piclas ../regressioncheck/WEK_poisson_PETSC/floating_boundary_condition_p-convergence && cd ..
    - echo " Using PGO profiling results for re-compiling with -DPICLAS_PERFORMANCE=ON -DUSE_PGO=ON -DCMAKE_BUILD_TYPE=Release"
    - cmake -B build_Leapfrog_PGO -DPICLAS_EQNSYSNAME=poisson -DPICLAS_TIMEDISCMETHOD=Leapfrog -DLIBS_BUILD_HDF5=OFF -DLIBS_USE_PETSC=ON -DPICLAS_PERFORMANCE=ON -DUSE_PGO=ON -DCMAKE_BUILD_TYPE=Release
    - cmake --build build_Leapfrog_PGO $FLAG_NCORES -t all
    - ./tools/strip-build-dir.sh --keep-coverage build_*

